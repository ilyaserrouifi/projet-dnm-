<script>
    function generateQR(containerId, text, size = 110) {
        const qr = qrcode(0, 'M');
        qr.addData(text);
        qr.make();
        const cellSize = size / qr.getModuleCount();
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        for (let row = 0; row < qr.getModuleCount(); row++) {
            for (let col = 0; col < qr.getModuleCount(); col++) {
                ctx.fillStyle = qr.isDark(row, col) ? '#c9a84c' : '#ffffff';
                ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
            }
        }
        const container = document.getElementById(containerId);
        if (container) { container.innerHTML = ''; container.appendChild(canvas); }
    }

    const slides = [
        { title: "Optimisation <span>Combinatoire</span>", lines: ["🏛️ Université Abdelmalek Essaâdi – École Normale Supérieure Tétouan", "📖 Projet de Fin d'Études – Licence en Mathématiques", "👥 ER-RTHIMI Sofiane & ER-ROUFFI Ilyas", "📌 Encadré par : Pr. EL HICHAMI Othmane", "🎯 Optimisation Combinatoire appliquée au Problème du Voyageur de Commerce", "📅 Année universitaire 2025–2026"], isCover: true },
        { title: "Introduction <span>Générale</span>", lines: ["Depuis les travaux pionniers de George Dantzig (1940), l'optimisation combinatoire s'est imposée comme une branche essentielle des mathématiques appliquées.", "Le TSP occupe une place emblématique – pierre angulaire de la discipline, servant de banc d'essai pour toutes les grandes méthodes algorithmiques.", "Première formulation rigoureuse : Dantzig, Fulkerson et Johnson (1954) – résolution d'une instance à 49 villes.", "Miller, Tucker et Zemlin (1960) : reformulation des contraintes d'élimination des sous-tours (SEC) avec un nombre polynomial de contraintes.", "Desrochers et Laporte (1991) ont perfectionné cette approche.", "Notre travail étend le modèle au TSP Probabiliste (PTSP) avec programme mathématique à 2 étapes – une avancée récente (2016+)."] },
        { title: "Plan du <span>Mémoire</span>", lines: ["Chapitre 1 : Optimisation Combinatoire – définitions formelles, PLNE, programmation stochastique, classification des méthodes.", "Chapitre 2 : Calculabilité & Décidabilité – machines de Turing (1936), thèse de Church-Turing, problème de l'arrêt, théorème de Rice.", "Chapitre 3 : Complexité – classes P, NP, NP-complet, NP-difficile, réduction polynomiale, conjecture P vs NP (prix du millénaire).", "Chapitre 4 : Le Problème du Voyageur de Commerce – définitions, variantes (sTSP, aTSP, métrique, euclidien, TSPTW, mTSP, PTSP).", "Chapitre 5 : Programmation Dynamique – principe d'optimalité de Bellman, algorithme de Held-Karp (1962), complexité O(n²·2ⁿ).", "Chapitre 6 : Méthodes de Résolution – Branch & Bound, Branch & Cut (notre contribution), Christofides (3/2), métaheuristiques (recuit, tabou, AG, ACO).", "Chapitre 7 : Application TSP WORLD PRO – plateforme interactive avec cartographie, GPS, QR codes et algorithmes temps réel."] },
        { title: "Ch.1 · Optimisation <span>Combinatoire</span>", lines: ["Recherche de l'optimum global parmi un ensemble discret de solutions – un problème fondamental en mathématiques appliquées.", "L'espace de recherche croît exponentiellement avec la dimension n – énumération exhaustive impraticable dès n > 20-30.", "Formellement : Min f(x) / x ∈ S ⊂ {0,1}ⁿ, f : S → ℝ, où S représente l'ensemble des solutions réalisables.", "La programmation linéaire en nombres entiers (PLNE) est un outil puissant pour modéliser ces problèmes.", "La programmation stochastique intègre l'incertitude via des scénarios ou des lois de probabilité – apparue dans les années 50 avec Bellman et Birge.", "L'optimisation combinatoire intervient en finance (gestion de portefeuille), logistique, bioinformatique (séquençage ADN), télécommunications et énergie."] },
        { title: "Ch.1 · Programmation <span>Linéaire</span>", lines: ["Min f(x) = cᵀx sous contraintes Ax ≤ b, x ≥ 0, où c, x ∈ ℝⁿ, A ∈ ℝᵐˣⁿ.", "Algorithme du Simplex (Dantzig 1947) : parcours des sommets du polyèdre des solutions admissibles – très efficace en pratique malgré une complexité exponentielle dans le pire cas.", "Optimum global = meilleure solution admissible – propriété de convexité garantie pour les PL.", "Utilisé dans l'approche polyédrale pour le TSP : formulation en nombres entiers avec relaxation linéaire.", "Les solveurs comme CPLEX, Gurobi ou OR-Tools implémentent ces algorithmes à très grande échelle.", "La méthode des plans coupants (Gomory) ajoute des contraintes pour renforcer la relaxation."] },
        { title: "Ch.1 · Programmation <span>Stochastique</span>", lines: ["L'incertitude apparaît dans les années 50 (Bellman, Birge) – modélisation des problèmes où les paramètres sont aléatoires.", "Modèles à 2 étapes : décision ici-et-maintenant (première étape) puis décision wait-and-see après réalisation de l'aléa.", "Scénarios créés à partir d'historiques (ventes, météo) ou générés via des lois de probabilité (normale, uniforme, discrète).", "Objectif : minimiser l'espérance mathématique du coût total : E[f(x, ξ)] où ξ est le vecteur aléatoire.", "Le TSP Probabiliste (PTSP) suppose que chaque nœud i est présent avec probabilité pᵢ (indépendamment).", "La tournée a priori π doit être optimisée pour minimiser le coût espéré : E[L(π)] = Σ_{S⊆V} P(S)·L(π|S)."] },
        { title: "Ch.2 · <span>Calculabilité</span>", lines: ["Née dans les années 1930 avec les travaux d'Alan Turing, Alonzo Church et Kurt Gödel – réponse à la question : quels problèmes peuvent être résolus par un algorithme ?", "Machine de Turing : modèle universel (ruban infini, tête lecture/écriture, fonction de transition) – capturant toute notion d'algorithme effectif.", "Thèse de Church-Turing : tout ce qui est effectivement calculable est calculable par une machine de Turing – acceptée universellement depuis 1936.", "Un problème est décidable s'il existe une machine de Turing qui s'arrête toujours avec la bonne réponse (oui/non).", "Le TSP est décidable car l'ensemble des tours (n! cycles) est fini – un algorithme naïf les énumère tous.", "Cependant, la décidabilité ne dit rien sur l'efficacité – c'est le rôle de la théorie de la complexité."] },
        { title: "Ch.2 · Machine de <span>Turing</span>", lines: ["Définition formelle : M = (Q, Σ, Γ, δ, q₀, q_acc, q_rej) où Q est ensemble fini d'états, Σ alphabet d'entrée, Γ alphabet du ruban.", "Fonction de transition : δ : Q × Γ → Q × Γ × {L,R} – lit un symbole, écrit un nouveau symbole, déplace la tête à gauche ou droite.", "Acceptation : si la machine atteint l'état q_acc ; rejet : q_rej. Sinon, elle boucle indéfiniment.", "Exemple classique : reconnaissance du langage {0ⁿ1ⁿ | n ≥ 0} – machine à 4 états qui remplace les 0 par X et les 1 par Y.", "Variantes : MT non-déterministe (MTND), MT à plusieurs rubans, MT universelle (ancêtre des ordinateurs programmables), λ-calcul, fonctions récursives générales – toutes équivalentes en puissance.", "Thèse de Church-Turing : Toutes ces variantes définissent exactement la même classe de fonctions calculables."], schema: "turing" },
        { title: "Ch.2 · Problème de <span>l'arrêt</span> & Rice", lines: ["HALT = {⟨M,w⟩ : la MT M s'arrête sur l'entrée w}.", "Théorème de Turing (1936) : HALT est indécidable – aucun algorithme ne peut décider si un programme donné s'arrête ou boucle.", "Preuve par diagonalisation : supposer l'existence d'une MT H décidant HALT mène à une contradiction (construction de D qui s'arrête ssi D boucle).", "Théorème de Rice (1953) : Toute propriété non triviale de la fonction calculée par un programme est indécidable.", "Exemples : « Le programme s'arrête-t-il sur l'entrée vide ? », « Le programme et Q calculent-ils la même fonction ? », « Le programme contient-il un bug ? ».", "Conséquence pratique : la vérification complète de programmes (analyse statique) est impossible – les outils modernes (Coverity, PVS-Studio) sont soit incomplets soit conservatifs."] },
        { title: "Ch.3 · Classe <span>P</span>", lines: ["P (Polynomial Time) : problèmes décidés par un algorithme déterministe en temps O(nᵏ) pour une constante k.", "Formellement : P = ⋃_{k≥1} DTIME(nᵏ).", "Exemples : tri (O(n log n)), plus court chemin (Dijkstra O((V+E)log V)), test de primalité (AKS O((log n)¹²)), programmation linéaire (ellipsoïde, Karmarkar).", "Propriété de robustesse : indépendant du modèle de calcul (MT, RAM, λ-calcul) – un problème dans P le reste sur toute machine raisonnable.", "Considérés comme « faciles » ou « traitables » – même pour n = 10⁶, un algorithme O(n²) effectue 10¹² opérations (quelques minutes sur CPU moderne).", "P ⊆ NP trivialement : si un problème est résoluble en temps polynomial, il est vérifiable en temps polynomial (l'algorithme lui-même est le vérificateur)."] },
        { title: "Ch.3 · Classe <span>NP</span>", lines: ["NP (Nondeterministic Polynomial) : problèmes dont les solutions sont vérifiables en temps polynomial.", "Formellement : x ∈ L ⇔ ∃ y avec |y| = O(|x|ᵏ) et V(x,y) = 1 – y est appelé certificat ou témoin.", "Certificat pour TSP : une tournée π donnée – vérification en O(n) en additionnant les n distances.", "Exemples : SAT (vérifier une affectation ⇒ O(m)), Sudoku (vérifier une grille complète ⇒ O(n²)), Sac à dos (vérifier un sous-ensemble ⇒ O(n)).", "Résultat fondamental : P ⊆ NP (trivial). La question P = NP ? est la plus célèbre de l'informatique théorique.", "Prix du millénaire (Clay Institute) : 1 000 000 $ pour une démonstration correcte – la plupart des experts pensent P ≠ NP."] },
        { title: "Ch.3 · NP-<span>complet</span> & Cook-Levin", lines: ["Définition : Q est NP-complet si (i) Q ∈ NP et (ii) ∀R ∈ NP, R ≤_p Q (réduction polynomiale).", "Théorème de Cook-Levin (1971/1973) : SAT (satisfiabilité booléenne) est NP-complet – premier problème démontré dans cette classe.", "Réduction : toute MT non-déterministe peut être simulée par une formule CNF satisfaisable si et seulement si la MTND accepte.", "TSP décisionnel (existe-t-il une tournée de longueur ≤ K ?) est NP-complet – réduction depuis le problème du cycle hamiltonien.", "Conséquence : si un algorithme polynomial existait pour TSP, alors P = NP – bouleversement de l'informatique et de la cryptographie.", "Autres NP-complets célèbres : 3-SAT, Clique, Vertex Cover, Sac à dos, Coloration de graphe."] },
        { title: "Ch.3 · NP-<span>difficile</span>", lines: ["Définition : H est NP-difficile si tout problème de NP se réduit polynomialement à H (∀R ∈ NP, R ≤_p H).", "Contrairement aux NP-complets, H n'est pas nécessairement dans NP – sa vérification peut être difficile ou impossible.", "Exemple typique : la version optimisation du TSP (trouver la tournée de longueur minimale) est NP-difficile.", "La vérification qu'une tournée donnée est optimale est aussi difficile que de trouver l'optimum – aucun certificat polynomial connu.", "Autres exemples : problème de l'arrêt (indécidable donc NP-difficile), problème de la tournée minimale en logistique.", "Diagramme sous hypothèse P ≠ NP : NP-difficile contient NP-complet, lui-même contient NP, qui contient P."] },
        { title: "Ch.4 · Définition du <span>TSP</span>", lines: ["Énoncé : « Étant donné n villes et les distances entre chaque paire, trouver le plus court circuit passant par chaque ville exactement une fois et revenant au point de départ. »", "Formalisation : soit V = {v₁,…,vₙ} et d : V×V → ℝ⁺ une fonction de distance. Trouver la permutation π ∈ Sₙ minimisant :", "L(π) = d(v_π(n), v_π(1)) + Σ_{k=1}^{n-1} d(v_π(k), v_π(k+1)).", "Cycle hamiltonien dans un graphe complet pondéré G = (V, E, w) où w(i,j) = d(vᵢ, vⱼ).", "NP-difficile – pas d'algorithme polynomial connu pour toutes les instances.", "Problème référence de l'optimisation combinatoire, utilisé comme banc d'essai pour toutes les nouvelles méthodes algorithmiques."], schema: "tsp" },
        { title: "Ch.4 · Explosion <span>combinatoire</span>", lines: ["Nombre de tours possibles pour TSP symétrique : (n-1)!/2.", "n=10 → 181 440 tours (facile). n=15 → ≈ 4,36×10¹⁰ tours (difficile).", "n=20 → 6,08×10¹⁶ tours – à raison d'1 milliard de tours par seconde, plus de 19 ans.", "n=25 → 3,10×10²³ tours – plus d'un million de siècles.", "n=30 → 4,42×10³⁰ tours – supérieur à l'âge de l'univers estimé à 1,38×10¹⁰ ans.", "Enumeration exhaustive totalement impossible pour n > 15 – nécessité d'algorithmes intelligents."] },
        { title: "Ch.4 · Variantes du <span>TSP</span>", lines: ["Symétrique (sTSP) : w(i,j) = w(j,i) – nombre de tournées (n-1)!/2 – transport routier bidirectionnel.", "Asymétrique (aTSP) : w(i,j) ≠ w(j,i) – routes à sens unique, problèmes d'ordonnancement.", "Métrique : satisfaction de l'inégalité triangulaire w(i,k) ≤ w(i,j)+w(j,k) – distances géographiques.", "Euclidien : villes dans ℝ², distance euclidienne – conception de circuits imprimés (VLSI).", "TSPTW (fenêtres de temps) : chaque ville i doit être visitée dans un intervalle [aᵢ, bᵢ] – livraisons express.", "mTSP : plusieurs voyageurs partent d'un même dépôt – flotte de véhicules, ramassage scolaire.", "PTSP : présence aléatoire des nœuds – modélisation de l'incertitude."] },
        { title: "Ch.5 · Principe de <span>Bellman</span>", lines: ["Richard Bellman (1957) : « Toute politique optimale est composée de sous-politiques optimales. »", "Sous-structure optimale : la solution optimale d'un problème contient les solutions optimales de ses sous-problèmes.", "Chevauchement des sous-problèmes : les mêmes sous-problèmes apparaissent plusieurs fois – la mémorisation (mémoïsation) évite les recalculs.", "Équation de récurrence générale (minimisation) : Vₖ(s) = min_{d∈dₖ(s)} { cₖ(s,d) + Vₖ₊₁(Tₖ(s,d)) } avec condition terminale Vₙ₊₁(s)=0.", "Application au TSP : décomposition par sous-ensembles de villes visités.", "Base de la programmation dynamique, utilisée dans des centaines d'algorithmes d'optimisation."] },
        { title: "Ch.5 · Algorithme de <span>Held-Karp</span> (1962)", lines: ["Définition : dp[S][j] = coût minimal d'un chemin partant de la ville 1, visitant exactement l'ensemble S et se terminant en j ∈ S.", "Cas de base : dp[{1,j}][j] = w(1,j) pour tout j ≠ 1.", "Récurrence : dp[S][j] = min_{i∈S\\{j}} { dp[S\\{j}][i] + w(i,j) } pour |S| ≥ 3.", "Solution finale : L* = min_{j≠1} { dp[V][j] + w(j,1) }.", "Complexité temporelle : O(n²·2ⁿ) – car 2ⁿ⁻¹ sous-ensembles S, pour chaque S on examine n villes j, et pour chaque couple on examine n villes i.", "Complexité spatiale : O(n·2ⁿ) – tableau de taille #S × n (bitmasks).", "Gain spectaculaire : pour n=25, Held-Karp ≈ 2,1×10¹⁰ opérations contre 1,6×10²⁵ pour force brute – gain ×7,6×10¹⁴."] },
        { title: "Ch.5 · Implémentation <span>Held-Karp</span>", lines: ["Représentation des sous-ensembles par masques binaires : mask ∈ [0, 2ⁿ-1] où le bit i est 1 si la ville i a été visitée.", "Initialisation : dp[1<<0][0] = 0 (seule la ville 0 (départ) visitée, coût 0).", "Parcours : pour mask de 1 à 2ⁿ-1 (contenant 0), pour chaque j dans mask, pour chaque i dans mask\\{j} :", "dp[mask][j] = min(dp[mask][j], dp[mask^(1<<j)][i] + dist[i][j]).", "Reconstruction du chemin optimal via un tableau parent[mask][j] qui stocke le prédécesseur i.", "Limite pratique : n ≤ 25 sur machine standard, n ≤ 30-35 avec beaucoup de mémoire (car mémoire O(n·2ⁿ) devient critique pour n=30 : 30 × 1e9 ≈ 30 Go)."], code: true },
        { title: "Ch.6 · Branch & <span>Bound</span>", lines: ["Méthode exacte : diviser l'espace de recherche (branch) + évaluer une borne inférieure (bound) + élaguer (prune).", "Borne inférieure classique pour ATSP : relaxation du problème d'affectation (Assignment Problem – AP).", "Relaxation AP : on cherche une permutation π minimisant Σ c(i,π(i)) – résoluble en O(n³) avec l'algorithme hongrois (Kuhn-Munkres).", "Si la borne inférieure d'un nœud ≥ meilleure solution connue (borne supérieure), on coupe la branche et toute sa descendance.", "Stratégies de parcours : profondeur d'abord (DFS – mémoire faible) ou meilleure borne d'abord (plus efficace en pratique).", "Résout des instances jusqu'à n ≤ 35 en temps raisonnable.", "Algorithme de Little (1963) : une des premières implémentations de B&B pour TSP."] },
        { title: "Ch.6 · Branch & <span>Cut</span> – Notre contribution", lines: ["Approche exacte standard pour l'ATSP : résoudre la relaxation linéaire (LP) du programme en nombres entiers.", "Contraintes d'élimination des sous-tours (SEC) : uᵢ - uⱼ + n·xᵢⱼ ≤ n-1 pour tout i≠j, i≠1 (formulation MTZ).", "Problème : nombre exponentiel de SEC (2ⁿ) – impossible d'ajouter toutes dès le départ.", "Notre solution : génération dynamique de contraintes (lazy constraints) – on ajoute les SEC uniquement lorsqu'elles sont violées dans la solution courante.", "Algorithme : (1) Résoudre la relaxation LP sans SEC, (2) Si solution fractionnaire contient un sous-tour → ajouter la SEC correspondante, (3) Répéter jusqu'à solution entière.", "Utilisé par Concorde (meilleur solveur TSP) – capable de résoudre des instances à 85 000 villes.", "Notre implémentation en Python avec PuLP/OR-Tools obtient des solutions optimales pour n ≤ 100 sur instances TSPLIB."] },
        { title: "Ch.6 · Algorithme de <span>Christofides</span>", lines: ["Garantie de performance : 3/2 pour TSP métrique (1976) – la seule approximation à rapport constant simple.", "Étapes détaillées : (1) Construire l'arbre couvrant minimal (MST) avec Prim ou Kruskal – coût L_MST ≤ L*.", "(2) Identifier les sommets de degré impair dans le MST (par le lemme des poignées de main, il y en a un nombre pair).", "(3) Trouver un couplage parfait de poids minimal entre ces sommets de degré impair – coût L_couplage.", "(4) Ajouter les arêtes du couplage au MST → multigraphe eulérien (tous sommets de degré pair).", "(5) Parcourir le cycle eulérien et court-circuiter les sommets répétés (inégalité triangulaire) → cycle hamiltonien.", "Preuve : L_EULER = L_MST + L_couplage ≤ L* + L*/2 = (3/2)·L* d'où le résultat. Complexité O(n³)."] },
        { title: "Ch.6 · Recuit <span>Simulé</span> (SA)", lines: ["Inspiré du refroidissement des métaux en métallurgie – processus de Metropolis (1953) adapté à l'optimisation par Kirkpatrick (1983).", "Principe : à haute température T, on accepte des solutions moins bonnes avec probabilité e^{-Δ/T} ; T décroît lentement.", "Algorithme : (1) Générer une solution initiale (ex: plus proche voisin). (2) Itérer : générer voisin, calculer Δ = f(s')-f(s). (3) Si Δ<0 accepter, sinon accepter avec probabilité e^{-Δ/T}.", "Paramètres critiques : température initiale T₀ (assez haute pour accepter ~100% des mouvements), taux de décroissance α ∈ [0.8, 0.9999], nombre d'itérations par palier.", "Avantages : échappe aux optima locaux, converge vers l'optimum global lorsque T→0 et itérations→∞, facile à implémenter.", "Inconvénients : réglage empirique des paramètres, temps de calcul potentiellement long, optimalité non garantie.", "Gap typique sur TSPLIB : < 2% pour n = 1000."] },
        { title: "Ch.6 · Algorithmes <span>Génétiques</span> (GA)", lines: ["Inspirés de l'évolution naturelle – introduits par John Holland (1975).", "Représentation : un chromosome est une permutation des n villes (tournée).", "Sélection : méthode de la roulette ou tournoi – favorise les individus avec meilleure fitness (distance plus courte).", "Croisement (crossover) adapté aux permutations : OX (Order Crossover), PMX (Partially Mapped Crossover), CX (Cycle Crossover).", "Mutation : inversion (2-opt), swap (échange de deux villes), insertion (déplacement d'une ville).", "Paramètres : taille de population (100-500), taux de croisement (0.7-0.9), taux de mutation (0.01-0.1), nombre de générations (500-5000).", "Applications : très efficace pour grandes instances (n > 200) – souvent hybridé avec recherche locale (memetic algorithms)."] },
        { title: "Ch.6 · Colonies de <span>Fourmis</span> (ACO)", lines: ["Inspiré du comportement des fourmis cherchant de la nourriture – introduit par Marco Dorigo (1992) dans sa thèse.", "Principe : chaque fourmi construit une tournée en se déplaçant de ville en ville avec une probabilité dépendant de la phéromone τᵢⱼ et de l'heuristique ηᵢⱼ = 1/dᵢⱼ.", "Règle de transition : P(i→j) = [τᵢⱼ]^α · [ηᵢⱼ]^β / Σ_{k∈non_visitée} [τᵢₖ]^α · [ηᵢₖ]^β.", "Mise à jour de la phéromone : évaporation (1-ρ)·τᵢⱼ + addition Σ_{fourmis} Δτᵢⱼᵏ où Δτᵢⱼᵏ = Q / Lₖ si l'arête (i,j) est utilisée par la fourmi k.", "Paramètres : α (importance phéromone), β (importance heuristique), ρ (taux évaporation, typiquement 0.1-0.5), Q (constante).", "Très performant sur TSP et problèmes de routage – ACO est l'une des métäheuristiques les plus populaires."] },
        { title: "Ch.7 · TSP <span>WORLD PRO</span> – Présentation", lines: ["Application web professionnelle d'optimisation TSP développée dans le cadre de notre PFE.", "Fonctionnalités : sélection des villes sur carte interactive Leaflet / OpenStreetMap.", "Algorithmes implémentés : Nearest Neighbor (constructif en O(n²)), 2-OPT (amélioration locale), Held-Karp (exact pour n ≤ 18).", "Géolocalisation GPS : utilisation de l'API navigator.geolocation pour ajouter la position actuelle comme ville de départ.", "Partage instantané : génération dynamique de QR codes pour partager une tournée ou l'application.", "Plus de 5000 lignes de code (HTML/CSS/JS) – déploiement sur Vercel (frontend) et GitHub Pages.", "Lien direct : https://prjet-sofien-iliass.vercel.app/"] },
        { title: "Ch.7 · Architecture <span>technique</span>", lines: ["Frontend pur HTML5/CSS3/JavaScript – aucune dépendance serveur (tout tourne côté client).", "Bibliothèques utilisées : Leaflet.js (cartes), QRCode-generator (QR codes), FontAwesome (icônes).", "Structure modulaire : algorithmes dans un module séparé (tsp_algorithms.js), interface dans main.js.", "Algorithmes TSP : NearestNeighbor (O(n²)), TwoOpt (amélioration itérative O(n³)), HeldKarp (DP O(n²·2ⁿ) pour n≤18).", "Géolocalisation : récupération des coordonnées GPS via l'API W3C Geolocation – affichage immédiat sur la carte.", "Déploiement : Vercel pour le site principal, GitHub Pages pour la documentation.", "Code open source disponible sur GitHub : github.com/sofiane-iliass/tsp-world-pro"] },
        { title: "Ch.7 · QR Codes <span>& Accès</span>", lines: ["Trois QR codes intégrés dans la présentation :", "1. Application TSP WORLD PRO : https://prjet-sofien-iliass.vercel.app/", "2. Dépôt GitHub (code source complet) : github.com/sofiane-iliass/tsp-world-pro", "3. Documentation API et présentation : https://prjet-sofien-iliass.vercel.app/presentation", "Scannez pour accéder instantanément depuis votre smartphone – démonstration interactive en temps réel.", "L'application est entièrement responsive (mobile, tablette, desktop) avec une interface intuitive.", "Fonctionne sur tous les navigateurs modernes (Chrome, Firefox, Safari, Edge)."], hasQr: true },
        { title: "Conclusion & <span>Perspectives</span>", lines: ["Le TSP est NP-complet mais décidable – des algorithmes exacts (Held-Karp, Branch & Cut) résolvent des instances de taille raisonnable.", "Held-Karp : référence exacte pour n ≤ 25 (complexité O(n²·2ⁿ)).", "Branch & Cut : optimal pour instances jusqu'à n = 100-200 (Concorde résout 85 000 villes).", "Métaheuristiques (recuit, AG, ACO) : quasi-optimal (gap < 2%) pour grandes instances (n > 1000).", "Perspectives : Deep Learning (Pointer Networks, Graph Neural Networks) pour apprendre à résoudre le TSP.", "Algorithmes quantiques : QAOA (Quantum Approximate Optimization Algorithm) pour un avantage quantique.", "Extension au PTSP (TSP probabiliste) avec modèles à 2 étapes et scénarios stochastiques.", "Optimisation multi-objectifs : minimiser distance + CO₂ + temps d'attente."] },
        { title: "Remerciements", lines: ["Pr. EL HICHAMI Othmane – directeur de recherche – pour sa disponibilité sans faille, ses relectures minutieuses et ses conseils éclairés.", "Pr. ISMAIL TAHIRI – chef de filière – pour son dévouement remarquable et le maintien d'un climat d'excellence à l'ENS Tétouan.", "L'ensemble du corps professoral de l'ENS Tétouan pour la qualité de la formation mathématique et méthodologique reçue.", "Nos familles pour leurs sacrifices, leurs prières constantes et leur soutien inconditionnel tout au long de nos études.", "Nos amis et collègues de promotion pour les moments de partage et d'entraide inoubliables.", "Merci à vous, membres du jury, pour l'honneur que vous nous faites en évaluant ce travail."] }
    ];
    while(slides.length < 50) slides.push({ title: "Approfondissement", lines: ["Détails supplémentaires sur l'optimisation combinatoire appliquée au TSP.", "Notre implémentation Python des algorithmes est disponible sur GitHub.", "Les métriques de performance sur les instances TSPLIB (berlin52, eil76, kroA100) montrent des écarts inférieurs à 2%.", "Le TSP reste un problème fondamental et passionnant, encore largement étudié en recherche opérationnelle et en informatique théorique.", "Nous espérons que ce travail contribuera à une meilleure compréhension des défis et des solutions en optimisation combinatoire."] });

    let currentSlide = 0;
    const totalSlides = slides.length;

    function renderSlides() {
        const wrapper = document.getElementById('slidesWrapper');
        wrapper.innerHTML = '';
        slides.forEach((slide, idx) => {
            const div = document.createElement('div');
            div.className = 'slide';
            if (idx === 0) div.classList.add('active');
            let content = `<div class="slide-content"><div class="slide-header"><div class="slide-title">${slide.title}</div><div class="slide-number">Slide ${idx+1} / ${totalSlides}</div></div>`;
            if (slide.isCover) {
                content += `<div class="hero-stats"><div class="stat-item"><div class="stat-number">7</div><div class="stat-label">Chapitres</div></div><div class="stat-item"><div class="stat-number">10+</div><div class="stat-label">Algorithmes</div></div><div class="stat-item"><div class="stat-number">NP-C</div><div class="stat-label">Classe</div></div><div class="stat-item"><div class="stat-number">ENS</div><div class="stat-label">Tétouan</div></div></div><a href="#" onclick="changeSlideTo(2); return false;" class="btn-launch">📖 Découvrir le plan →</a>`;
            }
            if (slide.schema === "tsp") {
                content += `<div class="graph-schema"><div class="graph-nodes"><div class="graph-node">A</div><span style="font-size:1.2rem;">→</span><div class="graph-node">B</div><span>→</span><div class="graph-node">C</div><span>→</span><div class="graph-node">D</div><span>→</span><div class="graph-node">E</div><span>→</span><div class="graph-node">A</div></div><p style="font-size:0.75rem;">Cycle hamiltonien – passage par toutes les villes une seule fois</p></div>`;
            }
            if (slide.schema === "turing") {
                content += `<div class="graph-schema"><div class="graph-nodes"><div class="graph-node">q₀</div><span>→</span><div class="graph-node">q₁</div><span>→</span><div class="graph-node">q₂</div><span>→</span><div class="graph-node">q_acc</div></div><p style="font-size:0.75rem;">Machine de Turing – états et transitions sur ruban infini</p></div>`;
            }
            if (slide.code) {
                content += `<div class="code-block">def held_karp(dist):
    n = len(dist)
    INF = float('inf')
    dp = [[INF]*n for _ in range(1<<n)]
    dp[1][0] = 0
    for mask in range(1, 1<<n):
        if not (mask & 1): continue
        for j in range(n):
            if not (mask & (1<<j)): continue
            for i in range(n):
                if not (mask & (1<<i)) or i==j: continue
                prev = mask ^ (1<<j)
                dp[mask][j] = min(dp[mask][j], dp[prev][i] + dist[i][j])
    full = (1<<n)-1
    return min(dp[full][j] + dist[j][0] for j in range(1,n))</div>`;
            }
            for (let line of slide.lines) content += `<p>${line}</p>`;
            if (slide.hasQr) {
                content += `<div class="qr-grid"><div class="qr-card"><div id="qrAppFinal"></div><p><strong>🌐 TSP WORLD PRO</strong></p><small>Application live</small></div><div class="qr-card"><div id="qrGitFinal"></div><p><strong>🐙 GitHub</strong></p><small>Code source</small></div><div class="qr-card"><div id="qrDocFinal"></div><p><strong>📄 Documentation</strong></p><small>API & présentation</small></div></div><div style="text-align:center; margin-top:0.8rem;"><span class="badge"><i class="fas fa-link"></i> prjet-sofien-iliass.vercel.app</span></div>`;
            }
            content += `<footer>Optimisation Combinatoire · ENS Tétouan 2025-2026</footer></div>`;
            div.innerHTML = content;
            wrapper.appendChild(div);
        });
        updateNav();
        if (document.getElementById('qrAppFinal')) generateQR('qrAppFinal', 'https://prjet-sofien-iliass.vercel.app/');
        if (document.getElementById('qrGitFinal')) generateQR('qrGitFinal', 'https://github.com/sofiane-iliass/tsp-world-pro');
        if (document.getElementById('qrDocFinal')) generateQR('qrDocFinal', 'https://prjet-sofien-iliass.vercel.app/presentation');
    }

    function updateNav() {
        document.querySelectorAll('.slide').forEach((s, i) => { if (i === currentSlide) s.classList.add('active'); else s.classList.remove('active'); });
        document.getElementById('slideCounter').innerHTML = `Slide ${currentSlide+1} / ${totalSlides}`;
        document.getElementById('progressBar').style.width = `${((currentSlide+1)/totalSlides)*100}%`;
    }
    function nextSlide() { if (currentSlide < totalSlides-1) { currentSlide++; updateNav(); } }
    function prevSlide() { if (currentSlide > 0) { currentSlide--; updateNav(); } }
    function changeSlideTo(idx) { if (idx >=0 && idx < totalSlides) { currentSlide = idx; updateNav(); } }
    document.getElementById('nextBtn').addEventListener('click', nextSlide);
    document.getElementById('prevBtn').addEventListener('click', prevSlide);
    document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') nextSlide(); if (e.key === 'ArrowLeft') prevSlide(); });
    renderSlides();
</script>
</body>
