<script>
    function generateQR(containerId, text, size = 110) {
        const qr = qrcode(0, 'M');
        qr.addData(text);
        qr.make();
        const cellSize = size / qr.getModuleCount();
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        for (let row = 0; row < qr.getModuleCount(); row++) {
            for (let col = 0; col < qr.getModuleCount(); col++) {
                ctx.fillStyle = qr.isDark(row, col) ? '#c9a84c' : '#ffffff';
                ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
            }
        }
        const container = document.getElementById(containerId);
        if (container) { container.innerHTML = ''; container.appendChild(canvas); }
    }

        { title: "Chapitre 1 · <span>Optimisation Combinatoire</span>", content: `
            <div class="chapter-header"><span class="badge">📖 CHAPITRE 1</span></div>
            <p>L'optimisation combinatoire consiste à trouver l'optimum global (minimum ou maximum) d'une fonction objectif sur un ensemble discret de solutions réalisables. Formellement : <strong>Min f(x) / x ∈ S ⊂ {0,1}ⁿ</strong>.</p>

        { title: "Chapitre 2 · <span>Calculabilité & Décidabilité</span>", content: `
            <div class="chapter-header"><span class="badge">📖 CHAPITRE 2</span></div>
            <p>Née dans les années 1930 avec Turing, Church et Gödel – réponse à la question : <strong>quels problèmes peuvent être résolus par un algorithme ?</strong></p>

            <p><strong>Définition de la table</strong> : dp[S][j] = coût minimal d'un chemin partant de la ville 1, visitant exactement l'ensemble S et se terminant en j ∈ S.</p>
            <p><strong>Cas de base</strong> : dp[{1,j}][j] = w(1,j).</p>
            <p><strong>Récurrence</strong> : dp[S][j] = min_{i∈S\\{j}} { dp[S\\{j}][i] + w(i,j) } pour |S| ≥ 3.</p>
            <p><strong>Solution finale</strong> : L* = min_{j≠1} { dp[V][j] + w(j,1) }.</p>
            <div class="code-block">Complexité : O(n²·2ⁿ) temps, O(n·2ⁿ) mémoire. Pour n=25 : 2,1×10¹⁰ opérations contre 1,6×10²⁵ pour force brute – gain ×7,6×10¹⁴.</div>
            <p>Limite pratique : n ≤ 25 sur machine standard, n ≤ 30-35 avec optimisation mémoire.</p>
            <div class="code-block">def held_karp(dist):
    n = len(dist)
    INF = float('inf')
    dp = [[INF]*n for _ in range(1<<n)]
    dp[1][0] = 0
    for mask in range(1, 1<<n):
        if not (mask & 1): continue
        for j in range(n):
            if not (mask & (1<<j)): continue
            for i in range(n):
                if not (mask & (1<<i)) or i==j: continue
                prev = mask ^ (1<<j)
                dp[mask][j] = min(dp[mask][j], dp[prev][i] + dist[i][j])
    full = (1<<n)-1
    return min(dp[full][j] + dist[j][0] for j in range(1,n))</div>

    // ensure at least 7 chapters are clearly shown (we have 12 slides)
    let currentSlide = 0;
    const totalSlides = slides.length;

    function renderSlides() {
        const wrapper = document.getElementById('slidesWrapper');
        wrapper.innerHTML = '';
        slides.forEach((slide, idx) => {
            const div = document.createElement('div');
            div.className = 'slide';
            if (idx === 0) div.classList.add('active');
            let content = `<div class="slide-content"><div class="slide-header"><div class="slide-title">${slide.title}</div><div class="slide-number">${idx+1} / ${totalSlides}</div></div>`;
            if (slide.isCover) content += slide.content;
            else content += `<div class="chapter-header" style="margin-bottom:1rem;"><span class="badge">📖 SLIDE ${idx+1}</span></div>` + slide.content;
            content += `<footer>Optimisation Combinatoire · ENS Tétouan 2025-2026 · ER-RTHIMI Sofiane & ER-ROUFFI Ilyas</footer></div>`;
            div.innerHTML = content;
            wrapper.appendChild(div);
        });
        updateNav();
        if (document.getElementById('qrAppFinal')) generateQR('qrAppFinal', 'https://prjet-sofien-iliass.vercel.app/');
        if (document.getElementById('qrGitFinal')) generateQR('qrGitFinal', 'https://github.com/sofiane-iliass/tsp-world-pro');
        if (document.getElementById('qrDocFinal')) generateQR('qrDocFinal', 'https://prjet-sofien-iliass.vercel.app/presentation');
    }

    function updateNav() {
        document.querySelectorAll('.slide').forEach((s, i) => { if (i === currentSlide) s.classList.add('active'); else s.classList.remove('active'); });
        document.getElementById('slideCounter').innerHTML = `Slide ${currentSlide+1} / ${totalSlides}`;
        document.getElementById('progressBar').style.width = `${((currentSlide+1)/totalSlides)*100}%`;
    }
    window.nextSlide = function() { if (currentSlide < totalSlides-1) { currentSlide++; updateNav(); } };
    window.prevSlide = function() { if (currentSlide > 0) { currentSlide--; updateNav(); } };
    window.changeSlideTo = function(idx) { if (idx >=0 && idx < totalSlides) { currentSlide = idx; updateNav(); } };
    document.getElementById('nextBtn').addEventListener('click', () => window.nextSlide());
    document.getElementById('prevBtn').addEventListener('click', () => window.prevSlide());
    document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') window.nextSlide(); if (e.key === 'ArrowLeft') window.prevSlide(); });
    renderSlides();
</script>
